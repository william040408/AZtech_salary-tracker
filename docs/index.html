<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>급여·연차 기록부</title>
<meta name="theme-color" content="#fdf7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14050a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="급여 기록부">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=41633176">
</head>
<body>

<div class="wrap">
  <section class="sec" id="setup" hidden>
    <div class="sec-hd"><h2>저장소 연결</h2></div>
    <div class="sec-body">
      <p class="smsg" id="setupMsg">데이터가 저장된 곳의 주소와 암구호를 입력하세요. 입력한 값은 이 기기에만 보관됩니다.</p>
      <div class="field"><label for="apiUrl">Worker 주소</label>
        <input id="apiUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://이름.계정.workers.dev"></div>
      <div class="field"><label for="apiPass">암구호</label>
        <input id="apiPass" type="password" autocomplete="current-password"></div>
      <button class="btn pri" id="apiSave" style="width:100%">연결</button>
    </div>
  </section>

  <div class="app" id="app" hidden>
  <header class="hd">
    <div>
      <div class="eyebrow" id="org"></div>
      <!-- 이름은 금고에서 받아 채운다. 저장소가 공개라 파일에 적지 않는다. -->
      <h1 id="title">급여·연차 기록부</h1>
    </div>
    <div class="svc">
      <div class="svc-row"><span id="svcRange"></span><span class="num" id="svcPct"></span></div>
      <div class="bar"><i id="svcBar" style="width:0%"></i></div>
      <div class="svc-row"><span class="num" id="svcDone"></span><span class="num" id="svcLeft"></span></div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-main">
      <span>남은 연차</span>
      <b class="num" id="heroBal">—</b>
    </div>
    <div class="hero-grid">
      <button type="button" data-detail="acc"  aria-expanded="false"><span>생긴 연차</span><b class="num" id="heroAcc">—</b></button>
      <button type="button" data-detail="mine" aria-expanded="false"><span>내가 쓴 것</span><b class="num" id="heroMine">—</b></button>
      <button type="button" data-detail="co"   aria-expanded="false"><span>회사가 쓰게 함</span><b class="num" id="heroCo">—</b></button>
    </div>
    <div class="hlist" id="heroList" hidden></div>
  </section>

  <section class="sec" id="forecast" hidden>
    <div class="sec-hd"><h2>이번 달 예상</h2><span class="hint" id="fcMonth"></span></div>
    <div class="sec-body">
      <table class="slip" id="fcTable"></table>
      <div class="fc-foot" id="fcFoot"></div>
    </div>
  </section>

  <div class="tiles">
    <div class="tile"><span>누적 실수령</span><b class="num" id="tNet"></b><small id="tNetSub"></small></div>
    <div class="tile"><span>만근 기준 실수령</span><b class="num" id="tRef"></b><small id="tRefSub"></small></div>
    <div class="tile"><span>쉰 날 합계</span><b class="num" id="tOff"></b><small id="tOffSub"></small></div>
  </div>

  <section class="sec" id="calSec">
    <div class="sec-hd">
      <h2>근태 달력</h2>
      <div class="nav">
        <button id="prev" aria-label="이전 달">‹</button>
        <span class="mlabel">
          <button id="mYear" class="mpart num" aria-haspopup="true"></button>
          <button id="mMonth" class="mpart num" aria-haspopup="true"></button>
        </span>
        <button id="next" aria-label="다음 달">›</button>
      </div>
    </div>
    <div class="sec-body">
      <div id="dbWarn" hidden class="offline">저장소에 연결하지 못했습니다. 변경한 내용이 저장되지 않습니다.</div>
      <div class="picker" id="picker" hidden>
        <div class="pk-head">
          <button id="pkPrev" aria-label="이전">‹</button>
          <span class="num" id="pkTitle"></span>
          <button id="pkNext" aria-label="다음">›</button>
        </div>
        <div class="pk-grid" id="pkGrid"></div>
      </div>
      <div id="calBody">
      <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="grid" id="grid"></div>
      </div>
      <div class="legend">
        <span><i style="background:var(--surface2);border-color:var(--line)"></i>근무</span>
        <span><i style="background:var(--paid-soft);border-color:var(--paid)"></i>연차 차감</span>
        <span><i style="background:linear-gradient(135deg,var(--paid-soft) 0 50%,var(--surface2) 50% 100%);border-color:var(--paid)"></i>반차</span>
        <span><i style="background:var(--unpaid-soft);border-color:var(--unpaid)"></i>급여 차감</span>
        <span><i style="background:var(--company-soft);border-color:var(--company)"></i>차감 없음</span>
        <span><i style="background:var(--hol-soft);border-color:var(--hol)"></i>공휴일</span>
      </div>
    </div>
    <div class="note">날짜를 눌러 그날의 성격을 기록합니다.</div>
  </section>

  <section class="sec" id="plan">
    <div class="sec-hd"><h2>연차 계획</h2><span class="hint" id="plHint"></span></div>
    <div class="sec-body">
      <div class="prow">
        <label class="pfield"><span>시작</span><input type="date" id="plFrom"></label>
        <label class="pfield"><span>끝</span><input type="date" id="plTo"></label>
        <button class="btn" type="button" id="plPick">달력에서 고르기</button>
      </div>
      <div id="plOut"></div>
    </div>
    <div class="note">쉬려는 구간을 정하면 급여가 얼마나 깎이는지 미리 계산합니다.</div>
  </section>

  <section class="sec">
    <div class="sec-hd"><h2>연차 대조</h2><span class="hint" id="lvAsOf"></span></div>
    <div class="sec-body">
      <div id="lvAlerts"></div>
      <div id="cmpBody"></div>
      <div class="bal"><span>잔여 연차</span><b class="num" id="lvBal"></b></div>
      <h3 class="sub-h">월별 잔여 연차</h3>
      <div class="ledger" id="ledger"></div>
    </div>
    <div class="note" id="lvNote"></div>
  </section>

  <section class="sec">
    <div class="sec-hd"><h2>월별 명세서 대조</h2>
      <div class="rwrap">
        <span class="rlast" id="rlast"></span>
        <button class="rbtn" id="refreshBtn" hidden>명세서 불러오기</button>
      </div></div>
    <div class="rmsg" id="refreshMsg" hidden>
      <div class="rbar"><i id="rbarFill"></i></div>
      <div class="rline"><b id="rphase"></b><span class="num" id="relapsed"></span></div>
      <div class="rhint" id="rhint"></div>
    </div>
    <div id="months"></div>
  </section>

  <button class="linkbtn" id="openSetup" hidden>연결 설정 변경</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <h3 id="shTitle">—</h3>
  <div class="sub" id="shSub">—</div>
  <div class="opts" id="shOpts"></div>
  <div class="times" id="shTimes" hidden>
    <input id="shStart" type="time" step="60" aria-label="출근 시각">
    <input id="shEnd" type="time" step="60" aria-label="퇴근 시각">
    <span class="thrs" id="shHours"></span>
  </div>
  <div class="sheet-foot">
    <button class="btn pri" id="shClose">닫기</button>
  </div>
</div>

<!-- 데이터 자리. 배포본에는 자리표시자 그대로 나가고, 페이지가 열린 뒤
     금고에서 받아온다. 개발 서버는 여기에 값을 박아서 내려 준다. -->
<script id="bundle" type="application/json">__BUNDLE__</script>
<script src="app.js?v=37cab852"></script>
</body>
</html>
